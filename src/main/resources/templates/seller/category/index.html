<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{admin/fragments/head :: head}"></head>

<body class="hold-transition skin-blue sidebar-mini">
<!-- Site wrapper -->
<div class="wrapper">

    <div th:replace="~{admin/fragments/header :: header}"></div>

    <!-- =============================================== -->

    <!-- Left side column. contains the sidebar -->
    <div th:replace="~{seller/fragments/sidebar :: sidebar}"></div>
    <!-- =============================================== -->

    <!-- Content Wrapper. Contains page content -->
    <div class="content-wrapper">
        <!-- Content Header (Page header) -->
        <section class="content-header">
            <h1>
                Blank page
                <small>it all starts here</small>
            </h1>
            <ol class="breadcrumb">
                <li><a href="#"><i class="fa fa-dashboard"></i> Home</a></li>
                <li><a href="#">Examples</a></li>
                <li class="active">Blank page</li>
            </ol>
        </section>

        <!-- Main content -->
        <section class="content">
            <div class="box">
                <div class="box-header with-border">
                    <h3 class="box-title">Danh sách danh mục</h3>
                    <div>
                        <a th:href="@{/seller/add-category}" class="btn btn-success">Thêm mới danh mục</a>
                    </div>
                </div>
                <!-- /.box-header -->
                <div class="box-body">
                    <table class="table table-striped table-hover table-bordered">
                        <thead class="thead-dark">
                        <tr>
                            <th scope="col" style="width: 10px" class="text-center">ID</th>
                            <th scope="col">Category Name</th>
                            <th scope="col">Status</th>
                            <th scope="col" class="text-center">Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="category : ${listCategories}">
                            <td class="text-center" th:text="${category.id}">1</td>
                            <td th:text="${category.categoryName}">Category 1</td>
                            <!--/*@thymesVar id="status" type=""*/-->
                            <td>
                                        <span th:if="${category.categoryStatus == 'active'}"
                                              class="label label-success">Hiện</span>
                                <span th:if="${category.categoryStatus != 'active'}"
                                      class="label label-danger">Ẩn</span>
                            </td>
                            <td class="text-center">
                                <a th:href="@{/seller/edit-category/{id}(id=${category.id})}"
                                   class="btn btn-primary btn-sm">Edit</a>
                                <!--                                        <a th:href="@{'/admin/edit-category/' + ${category.id}}"-->
                                <!--                                            class="btn btn-primary btn-sm">Edit</a>-->
                                <a th:href="@{/seller/delete-category/{id}(id=${category.id})}" onclick="return confirm('Bạn có chắc chắn muốn xóa không?')"
                                   class="btn btn-danger btn-sm">Delete</a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <!-- /.box-body -->
                <div class="box-footer clearfix">
                    <ul class="pagination pagination-sm no-margin pull-right">
                        <li class="page-item"><a class="page-link" href="#">«</a></li>
                        <li class="page-item"><a class="page-link" href="#">1</a></li>
                        <li class="page-item"><a class="page-link" href="#">2</a></li>
                        <li class="page-item"><a class="page-link" href="#">3</a></li>
                        <li class="page-item"><a class="page-link" href="#">»</a></li>
                    </ul>
                </div>
                <!-- /.box-footer -->
            </div>
        </section>
        <!-- /.content -->
    </div>
    <!-- /.content-wrapper -->

    <div th:replace="~{admin/fragments/footer :: footer}"></div>
</div>

<!-- ./wrapper -->
<div th:replace="~{admin/fragments/script :: script}"></div>
<!-- jQuery 3 -->

</body>

</html>
