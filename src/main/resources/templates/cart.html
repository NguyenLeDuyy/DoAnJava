<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>

<meta http-equiv="content-type" content="text/html;charset=UTF-8" /><!-- /Added by HTTrack -->

<head th:replace="~{layout/head :: head}" />

<body>
  <div class="page-wrapper">

    <head th:replace="~{layout/header :: header}" />

    <main class="main">
      <div class="page-header text-center" style="background-image: url('fe/images/page-header-bg.jpg')">
        <div class="container">
          <h1 class="page-title">Shopping Cart<span>Shop</span></h1>
        </div><!-- End .container -->
      </div><!-- End .page-header -->
      <nav aria-label="breadcrumb" class="breadcrumb-nav">
        <div class="container">
          <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="index.html">Home</a></li>
            <li class="breadcrumb-item"><a href="#">Shop</a></li>
            <li class="breadcrumb-item active" aria-current="page">Shopping Cart</li>
          </ol>
        </div><!-- End .container -->
      </nav><!-- End .breadcrumb-nav -->

      <div class="page-content">
        <div class="cart">
          <div class="container">
            <div class="row">
              <div class="col-lg-9">
                <div th:if="${check}" class="text-center alert-warning">
                  <p th:text="${check}"></p>
                </div>
                <table class="table table-cart table-mobile" th:if="${check == null}">
                  <thead>
                    <tr>
                      <th>Product</th>
                      <th>Price</th>
                      <th>Quantity</th>
                      <th>Total</th>
                      <th>Action</th>
                    </tr>
                  </thead>

                  <tbody>
                    <tr th:each="cartDetail : ${cart.getCartDetails()}">
                      <td class="product-col">
                        <div class="product">
                          <figure class="product-media">
                            <a th:href="@{/product-extended(id=${cartDetail.getFlower().id})}">
                              <img th:src="@{/uploads/{imageUrl}(imageUrl=${cartDetail.getFlower().imageUrl})}" alt="Product image">
                            </a>
                          </figure>

                          <h3 class="product-title">
                            <a href="#">Beige knitted elastic runner shoes</a>
                          </h3><!-- End .product-title -->
                        </div><!-- End .product -->
                      </td>
                      <td class="price-col" th:text="${#numbers.formatDecimal(cartDetail.getFlower().getPrice(),0,'COMMA',0,'POINT')} + ' VNĐ'"></td>

                      <form th:action="@{/update-cart}" method="post">

                        <input type="hidden" th:value="${cartDetail.getFlower().id}" name="id">
                        <td class="quantity-col">
                          <div class="cart-product-quantity">
                            <input type="number" class="form-control" th:value="${cartDetail.getQuantity()}" name="quantity" min="1" max="10" step="1"
                                   data-decimals="0" required>
                          </div><!-- End .cart-product-quantity -->
                        </td>
                        <td class="total-col" th:text="${#numbers.formatDecimal(cartDetail.getTotalPrice(),0,'COMMA',0,'POINT')} + ' VNĐ'"></td>
                        <td class="remove-col">
                          <button type="submit" name="action" value="update" title="Update" class="btn btn-primary">Update</button>
                          <button type="submit" name="action" value="delete" title="delete" class="btn btn-warning">Delete</button>
                        </td>

                      </form>
<!--                      -->

<!--                        <input type="hidden" th:value="${flower.id}" name="id">-->
<!--                        <td class="quantity-col">-->
<!--                          <div class="cart-product-quantity">-->
<!--                            <input type="number" class="form-control" th:value="${cartDetail.getQuantity()}" min="1" max="10" step="1"-->
<!--                              data-decimals="0" required>-->

<!--                          </div>&lt;!&ndash; End .cart-product-quantity &ndash;&gt;-->
<!--                        </td>-->
<!--                        <div class="remove-col">-->
<!--                        </div>-->
<!--                      </form>-->
<!--                      <form th:action="@{/delete-cart}" method="post">-->
<!--                        <input type="hidden" th:value="${flower.id}" name="id">-->
<!--                        <td class="total-col" th:text="${#numbers.formatDecimal(cartDetail.getTotalPrice(),0,'COMMA',0,'POINT')} + ' VNĐ'"></td>-->
<!--                        <td class="remove-col"><button class="btn-remove"><i class="icon-close"></i></button></td>-->


                    </tr>
                  </tbody>
                </table><!-- End .table table-wishlist -->

                <div class="cart-bottom">
                  <div class="cart-discount">
                    <form action="#">
                      <div class="input-group">
                        <input type="text" class="form-control" required placeholder="coupon code">
                        <div class="input-group-append">
                          <button class="btn btn-outline-primary-2" type="submit"><i
                              class="icon-long-arrow-right"></i></button>
                        </div><!-- .End .input-group-append -->
                      </div><!-- End .input-group -->
                    </form>
                  </div><!-- End .cart-discount -->

                  <a th:href="@{/cart}" class="btn btn-outline-dark-2"><span>UPDATE CART</span><i class="icon-refresh"></i></a>
                </div><!-- End .cart-bottom -->
              </div><!-- End .col-lg-9 -->
              <aside class="col-lg-3">
                <div class="summary summary-cart">
                  <h3 class="summary-title">Cart Total</h3><!-- End .summary-title -->

                  <table class="table table-summary">
                    <tbody>
                      <tr class="summary-subtotal">
                        <td>Subtotal:</td>
                        <td  th:text="${#numbers.formatDecimal(cart.getTotalPrice(),0,'COMMA',0,'POINT')} + ' VNĐ'"></td>
                      </tr><!-- End .summary-subtotal -->
                      <tr class="summary-shipping">
                        <td>Shipping:</td>
                        <td>&nbsp;</td>
                      </tr>

                      <tr class="summary-shipping-row">
                        <td>
                          <div class="custom-control custom-radio">
                            <input type="radio" id="free-shipping" name="shipping" class="custom-control-input">
                            <label class="custom-control-label" for="free-shipping">Free
                              Shipping</label>
                          </div><!-- End .custom-control -->
                        </td>
                        <td>$0.00</td>
                      </tr><!-- End .summary-shipping-row -->

                      <tr class="summary-shipping-row">
                        <td>
                          <div class="custom-control custom-radio">
                            <input type="radio" id="standart-shipping" name="shipping" class="custom-control-input">
                            <label class="custom-control-label" for="standart-shipping">Standart:</label>
                          </div><!-- End .custom-control -->
                        </td>
                        <td>$10.00</td>
                      </tr><!-- End .summary-shipping-row -->

                      <tr class="summary-shipping-row">
                        <td>
                          <div class="custom-control custom-radio">
                            <input type="radio" id="express-shipping" name="shipping" class="custom-control-input">
                            <label class="custom-control-label" for="express-shipping">Express:</label>
                          </div><!-- End .custom-control -->
                        </td>
                        <td>$20.00</td>
                      </tr><!-- End .summary-shipping-row -->

                      <tr class="summary-shipping-estimate">
                        <td>Estimate for Your Country<br> <a href="dashboard.html">Change
                            address</a></td>
                        <td>&nbsp;</td>
                      </tr><!-- End .summary-shipping-estimate -->

                      <tr class="summary-total">
                        <td>Total:</td>
                        <td  th:text="${#numbers.formatDecimal(cart.getTotalPrice(),0,'COMMA',0,'POINT')} + ' VNĐ'"></td>
                      </tr><!-- End .summary-total -->
                    </tbody>
                  </table><!-- End .table table-summary -->

                  <a th:href="@{checkout}" class="btn btn-outline-primary-2 btn-order btn-block">PROCEED TO CHECKOUT</a>
                </div><!-- End .summary -->

                <a href="category.html" class="btn btn-outline-dark-2 btn-block mb-3"><span>CONTINUE
                    SHOPPING</span><i class="icon-refresh"></i></a>
              </aside><!-- End .col-lg-3 -->
            </div><!-- End .row -->
          </div><!-- End .container -->
        </div><!-- End .cart -->
      </div><!-- End .page-content -->
    </main><!-- End .main -->

    <head th:replace="~{layout/footer :: footer}" />
  </div><!-- End .page-wrapper -->
  <button id="scroll-top" title="Back to Top"><i class="icon-arrow-up"></i></button>

  <!-- Mobile Menu -->
  <div class="mobile-menu-overlay"></div><!-- End .mobil-menu-overlay -->

  <div class="mobile-menu-container">
    <div class="mobile-menu-wrapper">
      <span class="mobile-menu-close"><i class="icon-close"></i></span>

      <form action="#" method="get" class="mobile-search">
        <label for="mobile-search" class="sr-only">Search</label>
        <input type="search" class="form-control" name="mobile-search" id="mobile-search" placeholder="Search in..."
          required>
        <button class="btn btn-primary" type="submit"><i class="icon-search"></i></button>
      </form>


      <div class="social-icons">
        <a href="#" class="social-icon" target="_blank" title="Facebook"><i class="icon-facebook-f"></i></a>
        <a href="#" class="social-icon" target="_blank" title="Twitter"><i class="icon-twitter"></i></a>
        <a href="#" class="social-icon" target="_blank" title="Instagram"><i class="icon-instagram"></i></a>
        <a href="#" class="social-icon" target="_blank" title="Youtube"><i class="icon-youtube"></i></a>
      </div><!-- End .social-icons -->
    </div><!-- End .mobile-menu-wrapper -->
  </div><!-- End .mobile-menu-container -->

  <!-- Sign in / Register Modal -->
  <!-- Plugins JS File -->
  <script th:replace="~{layout/script :: script}"></script>
</body>
