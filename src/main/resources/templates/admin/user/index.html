<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{admin/fragments/head :: head}"></head>

<body class="hold-transition skin-blue sidebar-mini">
    <!-- Site wrapper -->
    <div class="wrapper">

        <div th:replace="~{admin/fragments/header :: header}"></div>

        <!-- =============================================== -->

        <!-- Left side column. contains the sidebar -->
        <div th:replace="~{admin/fragments/sidebar :: sidebar}"></div>
        <!-- =============================================== -->

        <!-- Content Wrapper. Contains page content -->
        <div class="content-wrapper">
            <!-- Content Header (Page header) -->
            <section class="content-header">
                <h1>
                    Blank page
                    <small>it all starts here</small>
                </h1>
                <ol class="breadcrumb">
                    <li><a href="#"><i class="fa fa-dashboard"></i> Home</a></li>
                    <li><a href="#">Examples</a></li>
                    <li class="active">Blank page</li>
                </ol>
            </section>

            <!-- Main content -->
            <section class="content">
                <div class="box">
                    <div class="box-header with-border"></div>
                    <h3 class="box-title">Danh sách người dùng</h3>
                    <div>
                        <a th:href="@{/admin/user-add}" class="btn btn-success">Thêm mới người dùng</a>
                    </div>
                </div>
                <div class="box-body">
                    <table class="table table-striped table-hover table-bordered">
                        <thead class="thead-dark">
                            <tr>
                                <th scope="col" style="width: 10px" class="text-center">ID</th>
                                <th scope="col">Username</th>
                                <th scope="col">Email</th>
                                <th scope="col">Phone Number</th>
                                <th scope="col">Role</th>
                                <th scope="col">Status</th>
                                <th scope="col" class="text-center">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="user : ${listUsers}">
                                <td class="text-center" th:text="${user.id}">1</td>
                                <td th:text="${user.username ?: 'No Username'}">Username</td>
                                <td th:text="${user.email ?: 'No Email'}">Email</td>
                                <td th:text="${user.phoneNumber ?: 'No Phone'}">Phone</td>
                                <td th:text="${user.role == 1 ? 'Admin' : user.role == 2 ? 'User' : 'Seller'}">Role</td>
                                <td>
                                    <span th:class="${user.enabled ? 'label label-success' : 'label label-danger'}"
                                        th:text="${user.enabled ? 'Active' : 'Inactive'}">Status</span>
                                </td>
                                <td class="text-center">
                                    <a th:href="@{/admin/edit-user/{id}(id=${user.id})}"
                                        class="btn btn-primary btn-sm">Edit</a>
                                    <a th:href="@{/admin/delete-user/{id}(id=${user.id})}"
                                        onclick="return confirm('Bạn có chắc chắn muốn xóa người dùng này?')"
                                        class="btn btn-danger btn-sm">Delete</a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="box-footer clearfix">
                    <ul class="pagination pagination-sm no-margin pull-right">
                        <li class="page-item"><a class="page-link" href="#">«</a></li>
                        <li class="page-item"><a class="page-link" href="#">1</a></li>
                        <li class="page-item"><a class="page-link" href="#">2</a></li>
                        <li class="page-item"><a class="page-link" href="#">3</a></li>
                        <li class="page-item"><a class="page-link" href="#">»</a></li>
                    </ul>
                </div>
            </section>
            <!-- /.content -->
        </div>
        <!-- /.content-wrapper -->

        <div th:replace="~{admin/fragments/footer :: footer}"></div>
    </div>

    <!-- ./wrapper -->
    <div th:replace="~{admin/fragments/script :: script}"></div>
    <!-- jQuery 3 -->

</body>

</html>
