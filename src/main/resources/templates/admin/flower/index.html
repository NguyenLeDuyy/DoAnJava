<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{admin/fragments/head :: head}"></head>

<body class="hold-transition skin-blue sidebar-mini">
<!-- Site wrapper -->
<div class="wrapper">

    <div th:replace="~{admin/fragments/header :: header}"></div>

    <!-- =============================================== -->

    <!-- Left side column. contains the sidebar -->
    <div th:replace="~{admin/fragments/sidebar :: sidebar}"></div>
    <!-- =============================================== -->

    <!-- Content Wrapper. Contains page content -->
    <div class="content-wrapper">
        <!-- Content Header (Page header) -->
        <section class="content-header">
            <h1>
                Blank page
                <small>it all starts here</small>
            </h1>
            <ol class="breadcrumb">
                <li><a href="#"><i class="fa fa-dashboard"></i> Home</a></li>
                <li><a href="#">Examples</a></li>
                <li class="active">Blank page</li>
            </ol>
        </section>

        <!-- Main content -->
        <section class="content">
            <div class="box">
                <!-- /.box-header -->
                <div class="box-header with-border">
                    <h3 class="box-title">Danh sách hoa</h3>
                    <div>
                        <a th:href="@{/admin/add-flower}" class="btn btn-success">Thêm mới hoa</a>
                    </div>
                </div>
                <!-- /.box-header -->
                <div class="box-body">
                    <table class="table table-striped table-hover table-bordered">
                        <thead class="thead-dark">
                        <tr>
                            <th scope="col" style="width: 10px" class="text-center">ID</th>
                            <th scope="col">Flower Name</th>
                            <th scope="col">Description</th>
                            <th scope="col">Price</th>
                            <th scope="col">Image</th>
                            <th scope="col">Season</th>
                            <th scope="col">Quantity</th>
                            <th scope="col">Category</th>
                            <th scope="col">Supplier</th>
                            <th scope="col" class="text-center">Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="flower : ${listFlowers}">
                            <td class="text-center" th:text="${flower.id}">1</td>
                            <td th:text="${flower.flowerName}">Flower 1</td>
                            <td th:text="${flower.description}">Description 1</td>
                            <td th:text="${flower.price}">100.00</td>
                            <td><img th:src="@{/uploads/{imageUrl}(imageUrl=${flower.imageUrl})}" alt="Flower Image"
                                     style="width:50px;height:50px;"></td>
                            <td th:text="${flower.season}">Spring</td>
                            <td th:text="${flower.quantity}">10</td>
                            <td th:text="${flower.category.categoryName}">Category 1</td>
                            <td th:text="${flower.supplier?.name}">Supplier 1</td>
                            <td class="text-center">
                                <a th:href="@{/admin/edit-flower/{id}(id=${flower.id})}" class="btn btn-primary btn-sm">Edit</a>
                                <a th:href="@{/admin/delete-flower/{id}(id=${flower.id})}"
                                   onclick="return confirm('Bạn có chắc chắn muốn xóa không?')"
                                   class="btn btn-danger btn-sm">Delete</a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <!-- /.box-body -->
                <!-- /.box-body -->
                <div class="box-footer clearfix">
                    <ul class="pagination pagination-sm no-margin pull-right">
                        <li class="page-item"><a class="page-link" href="#">«</a></li>
                        <li class="page-item"><a class="page-link" href="#">1</a></li>
                        <li class="page-item"><a class="page-link" href="#">2</a></li>
                        <li class="page-item"><a class="page-link" href="#">3</a></li>
                        <li class="page-item"><a class="page-link" href="#">»</a></li>
                    </ul>
                </div>
                <!-- /.box-footer -->
            </div>
        </section>
        <!-- /.content -->
    </div>
    <!-- /.content-wrapper -->

    <div th:replace="~{admin/fragments/footer :: footer}"></div>
</div>

<!-- ./wrapper -->
<div th:replace="~{admin/fragments/script :: script}"></div>
<!-- jQuery 3 -->

</body>

</html>
