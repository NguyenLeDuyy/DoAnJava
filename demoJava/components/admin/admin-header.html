<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<link rel="stylesheet" href="resources/css/admin-dashboard.css">

<div class="header">
    <h1>ADMIN DASHBOARD</h1>
</div>
<div class="navbar">
    <a href="#">HOME</a>
    <a href="#">QUẢN LÝ KHÁCH HÀNG</a>
    <a href="#">QUẢN LÝ SẢN PHẨM</a>
    <a href="#">QUẢN LÝ ĐƠN HÀNG</a>
    <button>
        <i class="fas fa-sign-out-alt"></i>
    </button>
</div>
<script>
    document.querySelectorAll('.navbar a, .navbar button').forEach(element => {
    element.addEventListener('click', function() {
        document.querySelectorAll('.navbar a, .navbar button').forEach(item => item.classList.remove('active'));
        this.classList.add('active');
    });
});
</script>
