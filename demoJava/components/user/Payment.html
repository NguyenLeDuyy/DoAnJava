<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh Toán</title>
    <link href="../resources/css/style1.css" rel="stylesheet">
   
</head>

<body>
    
    <div class="payment-container">
    <div class="back-to-home t-left">
        <a href="http://localhost/DoAnJava-demo/DoAnJava-demo/demoJava/home.php">Trở về trang chủ</a>
    </div>
        <h2>Thông Tin Thanh Toán</h2>
        <form action="" method="post" id="payment-form">
            <div class="customer-info">
                <h3>Thông tin người mua</h3>
                <label for="full-name">Họ và Tên:</label>
                <input type="text" id="full-name" name="full-name" placeholder="Nhập họ và tên" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Nhập email" required>

                <label for="phone">Số điện thoại:</label>
                <input type="text" id="phone" name="phone" placeholder="Nhập số điện thoại" required>

                <label for="address">Địa chỉ giao hàng:</label>
                <input type="text" id="address" name="address" placeholder="Nhập địa chỉ giao hàng" required>

                <h3>Tóm tắt đơn hàng</h3>
                <div class="order-details">
                    <h3 class="order-details-title">Chi Tiết Sản Phẩm</h3>
                    <table class="order-details-table">
                        <thead>
                            <tr>
                                <th class="order-details-table-header">Sản phẩm</th>
                                <th class="order-details-table-header">Số lượng</th>
                                <th class="order-details-table-header">Giá</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>Hoa Hồng</td>
                                <td>2</td>
                                <td>200.000 VNĐ</td>
                            </tr>
                            <tr>
                                <td>Hoa Tulip</td>
                                <td>3</td>
                                <td>300.000 VNĐ</td>
                            </tr>
                            <tr>
                                <td colspan="2">Tổng tiền: </td>
                                <td>300.000 VNĐ</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                
            </div>

            <div class="payment-info">
                <h3>Phương thức thanh toán</h3>
                <label for="payment-method">Chọn phương thức thanh toán:</label>
                <select id="payment-method" name="payment-method" required>
                    <option value="cash-on-delivery" selected>Thanh toán bằng tiền mặt</option>
                    <option value="credit-card">Chuyển khoản</option>
                </select>                
            </div>
            <!-- lưu đơn nhảy đénw trang cảm ơn-->
            <div class="order-summary">
                <button type="submit" formaction="Thankyou.html" >Xác Nhận Thanh Toán</button>
            </div>
        </form>
    </div>

</body>
</html>
